# Drop-in TymOS do zigbee2mqtt.service. Powod: awaria 2026-08-19 — mostek serial-over-TCP w dongle
# ESP32 padl, Z2M raportowal, ze "dziala", a koordynator byl niedostepny 95 min. 18 urzadzen
# bateryjnych zgubilo rodzicow i czesc nie wrocila sama (trzeba bylo rozkrecac czujki). Przy powrocie
# w 2 min pierwsza proba rejoinu trafilaby w zywa siec i awarii by nie bylo. Stad dwie rzeczy:
#
# 1. WATCHDOG Z2M — `Z2M_WATCHDOG=0.5,1,2,3,5`. To WLASNY mechanizm Z2M (index.js), nie systemd:
#    przy nieoczekiwanej utracie adaptera Z2M sam startuje ponownie z narastajacym odstepem.
#    Wczesniej w logu bylo wprost „Starting Zigbee2MQTT without watchdog", czyli cichy zwis
#    mogl trwac dowolnie dlugo. (Type=notify + WatchdogSec NIE — inna funkcja, sd_notify.)
#
#    ZMIANA 2026-08-27: bylo `default` = 2 s / 1 / 5 / 15 / 30 / 60 min. Zmierzony koszt tej
#    eskalacji: pad 11:22 -> start 12:15 = 53 min przestoju, choc dongla zrebootowano o 11:33
#    i byl sprawny od ~11:35. Czyli ~40 min czekania na pusto. Przyczyna zwisow jest zewnetrzna
#    (mikroprzerwa w sieci zabija sesje ASH-over-TCP), wiec dluga karencja niczego nie leczy —
#    trzeba po prostu probowac dalej. Teraz lista konczy sie po ~11,5 min, Z2M robi process.exit,
#    a systemd (Restart=always, RestartSec=30) podnosi go razem z ExecStartPre. Efekt: rowny
#    rytm prob co ~12 min zamiast eskalacji do godziny. watchdogCount zeruje sie po udanym
#    starcie (index.js:160), wiec kazdy epizod liczy sie od nowa.
#
# 2. START DOPIERO GDY DONGLE JEST W SIECI. Dongle jest sieciowy i wstaje pozniej niz Pi — po
#    zaniku pradu dawalo to 31 restartow uslugi z EHOSTUNREACH, a ta petla nie pozwalala mostkowi
#    dojsc do handshake pozniej. ExecStartPre czeka na PING (nie na port!) — dongle przyjmuje tylko
#    JEDNO polaczenie TCP na 6638, wiec sprawdzanie portu przez nc podbiera socket samemu Z2M
#    i konczy sie „Port Error: read ECONNRESET". Sprawdzone na zywym systemie 2026-08-21.
#
# RestartSec=30 (bylo 5): po ubiciu procesu dongle potrzebuje chwili na zwolnienie polaczenia TCP.

[Unit]
After=network-online.target
Wants=network-online.target

[Service]
Environment=Z2M_WATCHDOG=0.5,1,2,3,5
Restart=always
RestartSec=30
ExecStartPre=/opt/tymos/scripts/wait_zigbee_dongle.sh
